<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SIEM Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Mini SIEM Dashboard</h1>
                <p class="text-sm text-gray-500 mt-1">Real-time Security Event & Threat Monitoring</p>
            </div>
            <div class="flex items-center space-x-4">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="auto-refresh-toggle" checked onchange="toggleAutoRefresh()" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-600 relative"></div>
                    <span class="ml-2 text-sm font-medium text-gray-700">Auto Refresh (3s)</span>
                </label>
                <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow flex items-center space-x-2">
                    <span>Refresh Now</span>
                </button>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
                <h2 class="text-lg font-semibold text-gray-600">Total Events Analyzed</h2>
                <p id="total-events" class="text-4xl font-bold text-blue-600 mt-2">0</p>
            </div>
            <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-500">
                <h2 class="text-lg font-semibold text-gray-600">Total Security Alerts</h2>
                <p id="total-alerts" class="text-4xl font-bold text-red-600 mt-2">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Alerts Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="bg-red-600 px-6 py-4">
                    <h2 class="text-xl font-bold text-white">Recent Alerts</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Severity</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rule</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP / User</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Message</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Events Table -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <div class="bg-blue-600 px-6 py-4">
                    <h2 class="text-xl font-bold text-white">Recent Events</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Level</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source IP</th>
                            </tr>
                        </thead>
                        <tbody id="events-body" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        let refreshTimer = null;

        function toggleAutoRefresh() {
            const isChecked = document.getElementById('auto-refresh-toggle').checked;
            if (isChecked) {
                if (!refreshTimer) {
                    refreshTimer = setInterval(fetchData, 3000);
                }
            } else {
                if (refreshTimer) {
                    clearInterval(refreshTimer);
                    refreshTimer = null;
                }
            }
        }

        async function fetchData() {
            try {
                // Fetch Stats
                const statsRes = await fetch(`${API_BASE}/stats`);
                const stats = await statsRes.json();
                document.getElementById('total-events').textContent = stats.total_events;
                document.getElementById('total-alerts').textContent = stats.total_alerts;

                // Fetch Alerts
                const alertsRes = await fetch(`${API_BASE}/alerts?limit=10`);
                const alerts = await alertsRes.json();
                const alertsBody = document.getElementById('alerts-body');
                alertsBody.innerHTML = '';
                if (alerts.length === 0) {
                    alertsBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No alerts found</td></tr>';
                } else {
                    alerts.forEach(alert => {
                        let severityClass = 'bg-yellow-100 text-yellow-800';
                        const sev = (alert.severity || '').toUpperCase();
                        if (sev === 'CRITICAL') {
                            severityClass = 'bg-purple-100 text-purple-900 border border-purple-400';
                        } else if (sev === 'HIGH') {
                            severityClass = 'bg-red-100 text-red-800 border border-red-300';
                        } else if (sev === 'MEDIUM') {
                            severityClass = 'bg-yellow-100 text-yellow-800';
                        } else {
                            severityClass = 'bg-blue-100 text-blue-800';
                        }
                        
                        const row = `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 py-0.5 inline-flex text-xs leading-5 font-semibold rounded-full ${severityClass}">${alert.severity}</span></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">${alert.rule}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${alert.ip || '-'} <br/> <span class="text-xs text-gray-400">${alert.user || ''}</span></td>
                                <td class="px-6 py-4 text-sm text-gray-500">${alert.message}</td>
                            </tr>
                        `;
                        alertsBody.innerHTML += row;
                    });
                }

                // Fetch Events
                const eventsRes = await fetch(`${API_BASE}/events?limit=10`);
                const events = await eventsRes.json();
                const eventsBody = document.getElementById('events-body');
                eventsBody.innerHTML = '';
                if (events.length === 0) {
                    eventsBody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No events found</td></tr>';
                } else {
                    events.forEach(event => {
                        const row = `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(event.timestamp).toLocaleString()}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm"><span class="px-2 py-0.5 text-xs rounded ${event.level === 'CRITICAL' ? 'bg-red-200 text-red-800 font-bold' : event.level === 'WARNING' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-700'}">${event.level}</span></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">${event.action}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${event.ip || '-'}</td>
                            </tr>
                        `;
                        eventsBody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Initial fetch and start auto-refresh
        fetchData();
        toggleAutoRefresh();
    </script>
</body>
</html>
